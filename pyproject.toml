[build-system]
requires = ["setuptools>=70"]
build-backend = "setuptools.build_meta"

[project]
name = "trajalyzer"
version = "0.1.0"
description = "Trajectory kinematics, streaming exemplars, and interactive diagnostics"
requires-python = ">=3.11"
dependencies = ["numpy>=2"]

[project.optional-dependencies]
cluster = ["faiss-cpu>=1.11.0", "scikit-learn>=1.5"]
emeans = ["faiss-cpu>=1.16.0", "scikit-learn>=1.5"]
corpus = ["pyarrow>=19"]
viewer = ["rerun-sdk==0.43.2"]
dev = ["black>=24", "ruff>=0.11", "pre-commit>=4", "faiss-cpu>=1.11.0", "scikit-learn>=1.5"]

[tool.setuptools.packages.find]
include = ["trajectory_manifold*"]

[tool.black]
line-length = 100
target-version = ["py311"]

[tool.ruff]
line-length = 100
target-version = "py311"
extend-exclude = ["web", "data", ".venv"]

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I", "B", "UP", "SIM"]
