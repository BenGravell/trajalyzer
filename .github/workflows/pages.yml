name: Deploy Trajalyzer to GitHub Pages
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: true
jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - run: python -m pip install -e '.[dev]'
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm ci
        working-directory: web
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: native
      - run: cargo fmt --manifest-path native/Cargo.toml
      - run: cargo clippy --manifest-path native/Cargo.toml --all-targets
      - run: cargo test --manifest-path native/Cargo.toml
      - run: python -m pip install -e '.[corpus]'
      - run: python scripts/stream_av2.py --split train --tracks av --all --workers 16 --save-slice-map --output data/av2-train
      - run: python scripts/fit_av2_exemplars.py data/av2-train data/av2-model --clusters 128 --passes 2
      - run: cargo run --release --manifest-path native/Cargo.toml -- --pack data/av2-train data/av2-model/model.json web/public/corpus
      - run: du -sh web/public/corpus && cat web/public/corpus/model-meta.json && cat web/public/corpus/source.json
      - run: ./scripts/check.sh
      - uses: actions/configure-pages@v5
        with:
          enablement: true
      - uses: actions/upload-pages-artifact@v3
        with:
          path: web/dist
      - id: deployment
        uses: actions/deploy-pages@v4
